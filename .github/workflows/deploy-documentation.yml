name: Deploy documentation
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
      - name: Create Mamba Symlink
        run: ln -s $(which micromamba) /usr/local/bin/mamba
      - name: Setup environment
        run: |
            pip install pulp==2.7.0 snakemake
            eval $(ssh-agent -s)
            mkdir -p ~/.ssh
            echo "${{ secrets.ANARCI_TCR_PMHC_SSH_KEY }}" > ~/.ssh/anarci_tcr_pmhc
            echo "${{ secrets.NETTCR_SSH_KEY }}" > ~/.ssh/nettcr
            chmod 600 ~/.ssh/anarci_tcr_pmhc ~/.ssh/nettcr
            ssh-add ~/.ssh/anarci_tcr_pmhc ~/.ssh/nettcr
            ssh-add -L
            wget https://gist.githubusercontent.com/mpdude/e56fcae5bc541b95187fa764aafb5e6d/raw/676626f0f8009d8b47743417dba436483cd929c6/ssh-deploy-key-wrapper.sh && chmod +x ssh-deploy-key-wrapper.sh
            export GIT_SSH="$(pwd)/ssh-deploy-key-wrapper.sh"
            export KEY_MODELLER=${{ secrets.MODELLER_KEY }}
            snakemake environment --quiet all --cores 1
            mamba run -n tcr-antigen-prediction pip install '.[develop]'
      - name: Install Pandoc
        uses: pandoc/actions/setup@v1
        with:
          version: 2.19
      - name: Build documentation
        run: |
          mamba activate ./.venv
          snakemake docs --cores 1
      - name: Publish documentation
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/public
